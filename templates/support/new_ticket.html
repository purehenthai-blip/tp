{% extends "base/base.html" %}
{% block title %}New Support Ticket{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="font-display text-2xl text-gray-100 mb-6 flex items-center gap-3"><i data-lucide="plus-circle" class="w-6 h-6 text-toast-400"></i> Open Support Ticket</h1>
  <div class="p-6 rounded-2xl bg-gray-800/60 border border-gray-700/50">
    <form method="POST">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">Subject *</label>
          <input type="text" name="subject" required placeholder="Briefly describe your issue" class="form-input">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1.5">Category</label>
            <select name="category" class="form-input">
              {% for val, label in categories %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1.5">Priority</label>
            <select name="priority" class="form-input">
              {% for val, label in priorities %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">Message *</label>
          <textarea name="content" rows="6" required placeholder="Describe your issue in detail..." class="form-input resize-none"></textarea>
        </div>
        <div class="p-3 rounded-lg bg-blue-500/10 border border-blue-500/20 text-xs text-blue-400 flex items-center gap-2">
          <i data-lucide="info" class="w-4 h-4 flex-shrink-0"></i>
          Support agents and admins will respond. Your identity stays anonymous. No impersonation.
        </div>
        <button type="submit" class="flex items-center gap-2 px-6 py-3 bg-toast-500 hover:bg-toast-400 text-white font-semibold rounded-xl text-sm transition-all">
          <i data-lucide="send" class="w-4 h-4"></i> Submit Ticket
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
