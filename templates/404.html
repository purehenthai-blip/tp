{% extends "base/base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center text-center px-4">
  <div>
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-gray-800 border border-gray-700 mb-8">
      <i data-lucide="search-x" class="w-12 h-12 text-gray-500"></i>
    </div>
    <h1 class="font-display text-5xl text-toast-400 mb-3">404</h1>
    <p class="text-xl text-gray-300 mb-2">Page not found</p>
    <p class="text-gray-500 mb-8">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex gap-4 justify-center">
      <a href="/" class="flex items-center gap-2 px-6 py-2.5 bg-toast-500 hover:bg-toast-400 text-white font-semibold rounded-xl transition-all"><i data-lucide="home" class="w-4 h-4"></i> Go Home</a>
      <a href="/listings/" class="flex items-center gap-2 px-6 py-2.5 bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold rounded-xl transition-all"><i data-lucide="shopping-bag" class="w-4 h-4"></i> Browse Listings</a>
    </div>
  </div>
</div>
{% endblock %}
