{% extends "base/base.html" %}
{% block content %}
<div class="container py-4">
  <h1>{{ page_title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Category</button>
    <a href="{% url 'admin_panel:categories' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
