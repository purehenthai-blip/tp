{% extends "base/base.html" %}
{% block title %}Login — ToasterPants{% endblock %}
{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-toast-500/10 border border-toast-500/20 mb-4">
        <i data-lucide="log-in" class="w-8 h-8 text-toast-400"></i>
      </div>
      <h1 class="font-display text-3xl text-gray-100">Welcome Back</h1>
      <p class="text-gray-500 text-sm mt-2">Enter your credentials to continue.</p>
    </div>
    <div class="p-8 rounded-2xl bg-gray-800/60 border border-gray-700/50 shadow-2xl">
      <form method="POST" novalidate>
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label for="id_username" class="block text-xs text-gray-400 mb-1.5 font-medium">Username</label>
            <input type="text" name="username" id="id_username" autocomplete="username" required
                   placeholder="Your username"
                   class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-gray-100 text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-toast-500">
          </div>
          <div>
            <label for="id_password" class="block text-xs text-gray-400 mb-1.5 font-medium">Password</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password" required
                   placeholder="Your password"
                   class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-gray-100 text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-toast-500">
          </div>
          {% if form.non_field_errors %}
          <div class="p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-sm text-red-400 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
            <span>{{ form.non_field_errors.0 }}</span>
          </div>
          {% endif %}
        </div>
        <button type="submit" class="w-full mt-6 py-3 bg-toast-500 hover:bg-toast-400 text-white font-bold rounded-xl transition-all text-sm flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i> Login
        </button>
        <p class="text-center text-sm text-gray-500 mt-4">No account? <a href="/accounts/register/" class="text-toast-400 hover:text-toast-300 font-medium">Register free</a></p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
