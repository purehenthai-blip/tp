name: Trigger auto deployment for toasterpants

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/toasterpants-AutoDeployTrigger-3901b986-9ea5-4d6e-9d74-a5ec693092b1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TOASTERPANTS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TOASTERPANTS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TOASTERPANTS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.TOASTERPANTS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TOASTERPANTS_REGISTRY_PASSWORD }}
          containerAppName: toasterpants
          resourceGroup: tp
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


